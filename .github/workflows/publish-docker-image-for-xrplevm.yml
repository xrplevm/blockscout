name: XRPL EVM Publish Docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Docker release version (0.0.0)"
        required: true

jobs:
  push_to_registry:
    name: Push Docker image to GitHub Container Registry
    runs-on: ubuntu-latest
    env:
      DOCKER_CHAIN_NAME: xrplevm
    steps:
      - uses: actions/checkout@v3
      - name: Add SHORT_SHA env property with commit short sha
        shell: bash
        run: echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-8`" >> $GITHUB_ENV
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub 👤
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags:  ghcr.io/blockscout/blockscout-${{ env.DOCKER_CHAIN_NAME }}:${{ github.event.inputs.version }}
          platforms: |
            linux/amd64
            linux/arm64/v8
          build-args: |
            BLOCKSCOUT_VERSION=v${{ github.event.inputs.version }}.+commit.${{ env.SHORT_SHA }}
            RELEASE_VERSION=${{ github.event.inputs.version }}
            CHAIN_TYPE=ethereum